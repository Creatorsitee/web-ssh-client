
name: Sync to Hugging Face Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true

      - name: Sync to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e

          git push --force \
            "https://cmnty-dev:${HF_TOKEN}@huggingface.co/spaces/cmnty-dev/ssh" \
            HEAD:main
